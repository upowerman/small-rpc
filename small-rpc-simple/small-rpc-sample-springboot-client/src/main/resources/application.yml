server:
  port: 8091
spring:
  application:
    name: hello-service-client

small-rpc:
  registry:
    type: local
    address: localhost:7080
  # 2.0 协议栈直连地址（指向 server 的 rpc2-port）
  rpc2:
    address: localhost:7081
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 2000
  zookeeper:
    connect-string: localhost:2181
    namespace: small-rpc
    base-path: /services
    session-timeout: 60000
    connection-timeout: 15000
